name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskflow_dev
          POSTGRES_PASSWORD: taskflow_dev_only
          POSTGRES_DB: taskflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        working-directory: backend
        run: ruff check .

      - name: Run Ruff Formatter Check
        working-directory: backend
        run: ruff format --check .

      - name: Prepare test database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U taskflow_dev -d taskflow_dev -c "CREATE DATABASE taskflow_test;"

      - name: Run Alembic migrations
        working-directory: backend
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-app-secret-for-tests-not-a-production-secret
          JWT_SECRET_KEY: ci-only-jwt-secret-for-tests-not-a-production-secret
          DATABASE_URL: postgresql+asyncpg://taskflow_dev:taskflow_dev_only@localhost:5432/taskflow_test
        run: |
          python -m alembic upgrade head

      - name: Run Pytest with Coverage
        working-directory: backend
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-only-app-secret-for-tests-not-a-production-secret
          JWT_SECRET_KEY: ci-only-jwt-secret-for-tests-not-a-production-secret
          DATABASE_URL: postgresql+asyncpg://taskflow_dev:taskflow_dev_only@localhost:5432/taskflow_test
          TEST_DATABASE_URL: postgresql+asyncpg://taskflow_dev:taskflow_dev_only@localhost:5432/taskflow_test
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest with Coverage
        working-directory: frontend
        run: npm run test -- --run --coverage

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
