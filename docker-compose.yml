
services:
  db:
    image: postgres:17-alpine
    container_name: taskflow_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow_dev}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
