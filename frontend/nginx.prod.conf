server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirror Vercel headers config)
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # SPA fallback — all paths not matching a real file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: aggressive caching (Vite adds content hashes)
    location ~* \.(js|css|woff2?|png|svg|ico|webp|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint (optional — nginx-level)
    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
